---
name: targetTrial
title: Target Trial Emulation
jus: '2.0'
compilerMode: tame

children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Person ID
        children:
          - type: VariablesListBox
            name: id
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Period
        children:
          - type: VariablesListBox
            name: period
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Treatment (0/1)
        children:
          - type: VariablesListBox
            name: treatment
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Outcome (0/1)
        children:
          - type: VariablesListBox
            name: outcome
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Eligible (0/1)
        children:
          - type: VariablesListBox
            name: eligible
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Censoring event (0/1)
        children:
          - type: VariablesListBox
            name: censor
            isTarget: true
            maxItemCount: 1

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Causal estimand
            children:
              - type: RadioButton
                name: estimand_itt
                optionName: estimand
                optionPart: itt
                label: Intention-to-treat
              - type: RadioButton
                name: estimand_pp
                optionName: estimand
                optionPart: pp
                label: Per-protocol
          - type: Label
            label: Prediction
            children:
              - type: ComboBox
                name: predictionType
              - type: TextBox
                name: maxFollowUp
                format: number
              - type: CheckBox
                name: confInt
                children:
                  - type: TextBox
                    name: ciSamples
                    label: Simulation draws
                    format: number
                    enable: (confInt)
          - type: Label
            label: Target population
            children:
              - type: ComboBox
                name: targetPopulation
              - type: TextBox
                name: targetTrialPeriod
                format: number
                enable: (targetPopulation:specific)
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Time models
            children:
              - type: ComboBox
                name: followupModel
              - type: ComboBox
                name: trialPeriodModel
          - type: Label
            label: Computation
            children:
              - type: TextBox
                name: chunkSize
                format: number
              - type: TextBox
                name: pControl
                format: number
              - type: TextBox
                name: seed
                format: number
          - type: Label
            label: Output
            children:
              - type: CheckBox
                name: showWeightPlot
              - type: CheckBox
                name: showSyntax

  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome-model covariates
        children:
          - type: VariablesListBox
            name: outcomeCovs
            isTarget: true

  - type: CollapseBox
    label: Adherence weights (per-protocol)
    collapsed: true
    stretchFactor: 1
    children:
      - type: VariableSupplier
        persistentItems: true
        children:
          - type: TargetLayoutBox
            label: Numerator covariates
            children:
              - type: VariablesListBox
                name: switchNumCovs
                isTarget: true
          - type: TargetLayoutBox
            label: Denominator covariates
            children:
              - type: VariablesListBox
                name: switchDenCovs
                isTarget: true

  - type: CollapseBox
    label: Informative censoring weights
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: useCensor
      - type: ComboBox
        name: poolModels
        enable: (useCensor)
      - type: VariableSupplier
        persistentItems: true
        children:
          - type: TargetLayoutBox
            label: Numerator covariates
            children:
              - type: VariablesListBox
                name: censorNumCovs
                isTarget: true
          - type: TargetLayoutBox
            label: Denominator covariates
            children:
              - type: VariablesListBox
                name: censorDenCovs
                isTarget: true

  - type: CollapseBox
    label: Analysis weights
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: truncateWeights
        children:
          - type: TextBox
            name: truncatePercentile
            label: Upper percentile
            suffix: '%'
            format: number
            enable: (truncateWeights)
...
