---
name: drSurvival
title: Doubly Robust Survival Effect
jus: '2.0'
compilerMode: tame

children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Follow-up time
        children:
          - type: VariablesListBox
            name: time
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Event (0/1)
        children:
          - type: VariablesListBox
            name: event
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Treatment (0/1)
        children:
          - type: VariablesListBox
            name: treatment
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Potential censoring time (optional)
        children:
          - type: VariablesListBox
            name: followupTime
            isTarget: true
            maxItemCount: 1

  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome-model covariates
        children:
          - type: VariablesListBox
            name: outcomeCovs
            isTarget: true
      - type: TargetLayoutBox
        label: Propensity-score covariates
        children:
          - type: VariablesListBox
            name: propensityCovs
            isTarget: true
      - type: TargetLayoutBox
        label: Censoring-model covariates
        children:
          - type: VariablesListBox
            name: censorCovs
            isTarget: true

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell: { column: 0, row: 0 }
        stretchFactor: 1
        children:
          - type: Label
            label: Estimand and models
            children:
              - type: TextBox
                name: horizon
                format: number
              - type: ComboBox
                name: psMethod
              - type: ComboBox
                name: censorMethod
      - type: LayoutBox
        cell: { column: 1, row: 0 }
        stretchFactor: 1
        children:
          - type: Label
            label: Inference
            children:
              - type: TextBox
                name: bootstrapSamples
                format: number
              - type: TextBox
                name: seed
                format: number
          - type: Label
            label: Output
            children:
              - type: CheckBox
                name: showBootstrapPlot
              - type: CheckBox
                name: showSyntax

  - type: CollapseBox
    label: Truncation and stability
    collapsed: true
    children:
      - type: TextBox
        name: minPS
        format: number
      - type: TextBox
        name: maxPS
        format: number
      - type: TextBox
        name: minCensorSurvival
        format: number
...
